<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kioo Studio — Social Content post</title>
<style>
* { box-sizing: border-box; }
@page { size: 1080px 1350px; margin: 0; }
html, body { margin: 0; width: 1080px; height: 1350px; }
body { font-family: Arial, Helvetica, sans-serif; color: #fffdf8; background: #182c25; }
.post { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #182c25; }
.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 43%; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,31,27,.36) 0%, rgba(17,31,27,.06) 28%, rgba(17,31,27,.10) 50%, rgba(17,31,27,.86) 76%, #182c25 100%); }
.topline { position: absolute; top: 58px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
.brand { font-size: 19px; line-height: 1; font-weight: 700; letter-spacing: 3.4px; }
.location { font-size: 11px; line-height: 1.3; letter-spacing: 2px; text-transform: uppercase; text-align: right; }
.copy { position: absolute; left: 70px; right: 70px; bottom: 76px; }
.eyebrow { margin: 0 0 24px; color: #d8c492; font-size: 13px; line-height: 1.2; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
h1 { max-width: 900px; margin: 0; color: #fffdf8; font-family: Georgia, 'Times New Roman', serif; font-size: 78px; line-height: 1.02; font-weight: 400; letter-spacing: -1.7px; }
.description { max-width: 820px; margin: 23px 0 0; color: rgba(255,253,248,.90); font-size: 23px; line-height: 1.46; }
.cta { display: inline-flex; align-items: center; gap: 18px; margin-top: 31px; padding: 16px 20px; border: 1px solid rgba(255,253,248,.55); color: #fffdf8; font-size: 12px; line-height: 1; font-weight: 700; letter-spacing: 1.7px; }
.cta span { color: #d8c492; font-size: 18px; }
</style>
</head>
<body>
<main class="post" aria-label="Kioo Studio social media post promoting The Content Kit">
  <img class="photo" src="source/phone-call.webp" alt="Businesswoman talking on a phone while using a laptop">
  <div class="shade" aria-hidden="true"></div>
  <header class="topline"><span class="brand">KIOO STUDIO</span><span class="location">Clear, practical content<br>for small businesses</span></header>
  <section class="copy">
    <p class="eyebrow">SOCIAL CONTENT · THE CONTENT KIT</p>
    <h1>Make your next post count.</h1>
    <p class="description">Clear ideas and captions that help customers understand what you offer—and what to do next.</p>
    <div class="cta">EXPLORE THE CONTENT KIT <span>↗</span></div>
  </section>
</main>
</body>
</html>
