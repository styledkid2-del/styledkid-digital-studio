<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Social content campaign preview</title><desc id="d">Three coordinated sample social post designs for a fictional cafe, shown as a campaign system.</desc><rect width="960" height="600" fill="#f1e9df"/><circle cx="815" cy="100" r="135" fill="#e3d5c3"/><text x="58" y="61" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" fill="#65725d">SOCIAL CONTENT / SAMPLE CAMPAIGN</text><text x="58" y="108" font-family="Georgia,serif" font-size="39" fill="#263c30">A little more intention.</text><text x="58" y="135" font-family="Arial,sans-serif" font-size="12" fill="#65725d">Consistent visuals, useful words, one recognisable voice.</text><g transform="translate(60 170)"><rect width="248" height="350" rx="3" fill="#fffdf8" stroke="#d7d0c4"/><rect x="0" y="0" width="248" height="195" fill="#dce5d3"/><circle cx="185" cy="54" r="38" fill="#c0d0b5"/><path d="M105 160Q120 95 161 90Q200 120 193 160Z" fill="#9eaf8b"/><rect x="73" y="93" width="99" height="69" rx="9" fill="#f5eee0" stroke="#b6bba7"/><rect x="83" y="105" width="79" height="47" rx="5" fill="#f7f3e9"/><text x="124" y="124" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#3a503d">slow</text><text x="124" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#3a503d">mornings</text><text x="20" y="227" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#8b4b33">01 / PRODUCT STORY</text><text x="20" y="260" font-family="Georgia,serif" font-size="23" fill="#263c30">Meet your</text><text x="20" y="287" font-family="Georgia,serif" font-size="23" font-style="italic" fill="#8b4b33">new ritual.</text><text x="20" y="321" font-family="Arial,sans-serif" font-size="9" fill="#65725d">A clear story, not just a product.</text></g><g transform="translate(356 170)"><rect width="248" height="350" rx="3" fill="#fffaf3" stroke="#d7d0c4"/><rect width="248" height="195" fill="#e8c5a7"/><circle cx="124" cy="95" r="63" fill="#f5e7d7"/><ellipse cx="124" cy="101" rx="47" ry="42" fill="#e7b76e"/><ellipse cx="124" cy="99" rx="37" ry="32" fill="#b45f39"/><circle cx="107" cy="90" r="8" fill="#7c965a"/><circle cx="137" cy="112" r="8" fill="#7c965a"/><circle cx="145" cy="86" r="6" fill="#f1d68c"/><text x="20" y="227" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#8b4b33">02 / DAILY OFFER</text><text x="20" y="260" font-family="Georgia,serif" font-size="23" fill="#263c30">Made with</text><text x="20" y="287" font-family="Georgia,serif" font-size="23" font-style="italic" fill="#8b4b33">heart.</text><text x="20" y="321" font-family="Arial,sans-serif" font-size="9" fill="#65725d">A friendly reason to stop by.</text></g><g transform="translate(652 170)"><rect width="248" height="350" rx="3" fill="#263c30" stroke="#263c30"/><circle cx="198" cy="40" r="50" fill="#415d46"/><path d="M25 48H222" stroke="#71866b"/><text x="20" y="32" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#d7dfce">03 / COMMUNITY</text><text x="20" y="100" font-family="Georgia,serif" font-size="25" fill="#fffaf3">What's one</text><text x="20" y="131" font-family="Georgia,serif" font-size="25" font-style="italic" fill="#d4b091">small win?</text><rect x="20" y="159" width="145" height="2" fill="#d4b091"/><text x="20" y="188" font-family="Arial,sans-serif" font-size="10" fill="#dce5d3">Tell us below ↘</text><text x="20" y="242" font-family="Georgia,serif" font-size="22" fill="#fffaf3">Make room</text><text x="20" y="270" font-family="Georgia,serif" font-size="22" fill="#fffaf3">for connection.</text><text x="20" y="322" font-family="Arial,sans-serif" font-size="9" fill="#c5d5bb">CLEAR. HUMAN. CONSISTENT.</text></g><text x="60" y="565" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2" fill="#65725d">FICTIONAL EXAMPLES • GRAPHICS AND PUBLISHING SUBJECT TO AGREED SCOPE</text></svg>