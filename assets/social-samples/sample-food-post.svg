<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Illustrative food business social post</title><desc id="desc">A fictional cafe promotion with a stylized bowl of colorful food.</desc><rect width="1080" height="1350" fill="#f4e4d2"/><circle cx="540" cy="690" r="340" fill="#e5b68d"/><circle cx="540" cy="690" r="292" fill="#fff8ec" stroke="#334838" stroke-width="9"/><circle cx="540" cy="690" r="245" fill="#c6d5ad"/><path d="M360 590c80-120 190-135 285-65 60 45 70 120 15 165-80 65-190 45-300-100Z" fill="#d86d43"/><path d="M380 750c70-120 190-100 265-35 55 50 45 115-35 145-95 35-175-10-230-110Z" fill="#e6c15e"/><path d="M475 510c110 10 190 70 180 150-10 60-90 80-150 40-70-45-85-110-30-190Z" fill="#6f8a58"/><g fill="#9f482a"><circle cx="440" cy="670" r="24"/><circle cx="600" cy="805" r="19"/><circle cx="660" cy="625" r="22"/><circle cx="500" cy="825" r="17"/></g><g stroke="#fff4de" stroke-width="9" stroke-linecap="round"><path d="M390 700l70 20"/><path d="M565 560l45 20"/><path d="M570 755l65-30"/><path d="M460 600l40-30"/></g><text x="78" y="100" fill="#4a5942" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="7">KIOO STUDIO · SAMPLE 02</text><text x="78" y="215" fill="#25382c" font-family="Georgia,serif" font-size="82">Good food,</text><text x="78" y="305" fill="#9f482a" font-family="Georgia,serif" font-size="82" font-style="italic">good mood.</text><text x="78" y="385" fill="#4a5942" font-family="Arial,sans-serif" font-size="27">Your lunch break deserves a little colour.</text><rect x="78" y="1060" width="924" height="190" fill="#25382c"/><text x="122" y="1125" fill="#dce6cf" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">MENU SPOTLIGHT</text><text x="122" y="1185" fill="#fff8ec" font-family="Georgia,serif" font-size="36">Freshly made. Ready when you are.</text><text x="122" y="1225" fill="#dce6cf" font-family="Arial,sans-serif" font-size="19">Add your real menu item, price and ordering details.</text><text x="78" y="1310" fill="#4a5942" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">FICTIONAL CONCEPT · NOT CLIENT WORK</text></svg>