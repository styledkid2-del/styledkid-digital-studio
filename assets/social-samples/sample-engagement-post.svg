<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Illustrative audience engagement social post</title><desc id="desc">A bold fictional community prompt post with layered typography and abstract shapes.</desc><rect width="1080" height="1350" fill="#e6def0"/><path d="M760 0h320v600C900 650 780 540 760 400 740 260 790 140 760 0Z" fill="#c7d8bd"/><circle cx="850" cy="340" r="155" fill="#d97951"/><path d="M720 515c90-95 190-95 290 0v130H720Z" fill="#4c6249"/><text x="78" y="100" fill="#4c5949" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="7">KIOO STUDIO · SAMPLE 03</text><text x="78" y="300" fill="#202d24" font-family="Georgia,serif" font-size="94">Let’s talk</text><text x="78" y="405" fill="#9f482a" font-family="Georgia,serif" font-size="94" font-style="italic">small wins.</text><path d="M82 465h400" stroke="#4c6249" stroke-width="4"/><text x="82" y="545" fill="#303e31" font-family="Arial,sans-serif" font-size="31">What’s one thing your business</text><text x="82" y="590" fill="#303e31" font-family="Arial,sans-serif" font-size="31">is proud of this week?</text><g transform="translate(80 700)"><rect width="920" height="255" rx="6" fill="#fffaf1"/><circle cx="90" cy="90" r="33" fill="#d97951"/><path d="M76 90l10 10 20-24" fill="none" stroke="#fffaf1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="80" fill="#27382c" font-family="Arial,sans-serif" font-size="25" font-weight="700">Invite a real conversation</text><text x="150" y="126" fill="#596351" font-family="Arial,sans-serif" font-size="23">Keep the question easy to answer.</text><text x="150" y="168" fill="#596351" font-family="Arial,sans-serif" font-size="23">Reply to comments with care.</text><rect x="150" y="190" width="265" height="45" rx="22" fill="#27382c"/><text x="282" y="220" text-anchor="middle" fill="#fffaf1" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">YOUR TURN ↗</text></g><text x="80" y="1080" fill="#27382c" font-family="Georgia,serif" font-size="38">Small conversations build</text><text x="80" y="1128" fill="#27382c" font-family="Georgia,serif" font-size="38">stronger community.</text><text x="78" y="1310" fill="#4c5949" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">FICTIONAL CONCEPT · NOT CLIENT WORK</text></svg>